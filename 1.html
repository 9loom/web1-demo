<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>试用期作业2</title>
    <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
            /* 全屏背景图 课件背景属性 */
            background-image: url("https://picsum.photos/seed/apple-sea/1920/1080");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
        /* 左右两栏 用行内块并排 不用flex 课件讲过inline-block */
        .left-text {
            width: 50%;
            height: 100vh;
            display: inline-block;
            vertical-align: top;
            padding: 3rem;
        }
        .left-text h2 {
            /* 文本属性：color、font-size、font-weight、line-height、text-align 共5种以上 */
            color: #576c85;
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.5;
            text-align: left;
            margin-bottom: 1.5rem;
        }
        .left-text p {
            color: #0b5945;
            font-size: 1.1rem;
            line-height: 2;
            text-align: left;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            margin-bottom: 1rem;
        }
        /* 右侧表单区域 行内块+垂直居中 不用flex */
        .right-form {
            width: 49%;
            height: 100vh;
            display: inline-block;
            vertical-align: middle;
        }
        .form-card {
            width: 70%;
            /* margin:0 auto 实现水平居中 课件讲过 */
            margin: 0 auto;
            padding: 2rem;
            border: 2px solid #87d4d8;
            border-radius: 12px;
            background-color: rgba(255,255,255,0.9);
        }
        .form-card h3 {
            text-align: center;
            color: #3f889e;
            font-size: 1.4rem;
            margin-bottom: 1.8rem;
        }
        .form-item {
            margin-bottom: 1.2rem;
        }
        .form-item p {
            margin-bottom: 0.5rem;
            color: #333;
        }
        .form-item label {
            margin-bottom: 0.4rem;
            font-size: 1rem;
        }
        /* 所有input统一样式 课件讲过input不继承字体 */
        .form-item input[type="text"],
        .form-item input[type="password"] {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #76a48f;
            border-radius: 6px;
            font-family: inherit;
            margin-top: 0.3rem;
        }
        /* 验证码行 用inline-block+vertical-align实现垂直居中 不用flex */
        .captcha-box {
            margin-top: 0.3rem;
        }
        .captcha-box input {
            width: 75%;
            padding: 0.6rem;
            border: 1px solid #76a48f;
            border-radius: 6px;
            font-family: inherit;
            display: inline-block;
            vertical-align: middle;
        }
        .captcha-box img {
            width: 100px;
            height: 40px;
            border: 1px solid #71b58c;
            border-radius: 4px;
            display: inline-block;
            vertical-align: middle;
            margin-left: 0.5rem;
        }
        /* 单选/复选框 行内块 垂直对齐 */
        .form-item input[type="radio"],
        .form-item input[type="checkbox"] {
            display: inline-block;
            vertical-align: middle;
            margin-right: 0.3rem;
        }
        .form-item .option-line {
            margin-bottom: 0.4rem;
        }
        /* 文本域 */
        textarea {
            width: 100%;
            height: 80px;
            margin-top: 0.3rem;
            padding: 0.6rem;
            border: 1px solid #76a48f;
            border-radius: 6px;
            font-family: inherit;
            resize: none;
        }
        .submit-btn {
            width: 100%;
            padding: 0.7rem;
            margin-top: 1rem;
            background-color: #3f909e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="left-text">
        <h2>试用期作业2</h2>
        <p>哦哈哟 ✌️——seikai☁️ Good morning☀️World🌏</p >
        <p>Banishment this world</p >
        <p>哦哦oo。。。</p >
        <p>请试着填写一下右边吧</p >
    </div>
    <div class="right-form">
        <div class="form-card">
            <h3>试用期作业2</h3>
            <form>
                <!-- 是否是二次元 单选 -->
                <div class="form-item">
                    <p>是否是二次元</p >
                    <div class="option-line">
                        <input type="radio" name="yesNo" id="q1">
                        <label for="q1">是二次元</label>
                    </div>
                    <div class="option-line">
                        <input type="radio" name="yesNo" id="q2">
                        <label for="q2">不是二次元</label>
                    </div>
                </div>
                <!-- 怎么入坑的 单选 -->
                <div class="form-item">
                    <p>怎么入坑的</p >
                    <div class="option-line">
                        <input type="radio" name="joinWay" id="j1">
                        <label for="j1">朋友介绍</label>
                    </div>
                    <div class="option-line">
                        <input type="radio" name="joinWay" id="j2">
                        <label for="j2">偶然刷到</label>
                    </div>
                </div>
                <!-- 喜欢的种类 复选 -->
                <div class="form-item">
                    <p>喜欢的种类</p >
                    <div class="option-line">
                        <input type="checkbox" name="wish" id="w1">
                        <label for="w1">泡面番</label>
                    </div>
                    <div class="option-line">
                        <input type="checkbox" name="wish" id="w2">
                        <label for="w2">少女番</label>
                    </div>
                    <div class="option-line">
                        <input type="checkbox" name="wish" id="w3">
                        <label for="w3">热血番</label>
                    </div>
                    <div class="option-line">
                        <input type="checkbox" name="wish" id="w4">
                        <label for="w4">推理番</label>
                    </div>
                </div>
                <!-- 账号密码 -->
                <div class="form-item">
                    <label>CN</label>
                    <input type="text" placeholder="请输入账号">
                </div>
                <div class="form-item">
                    <label>密码</label>
                    <input type="password" placeholder="请输入密码">
                </div>
                
                <div class="form-item">
                    <label>验证码</label>
                    <div class="captcha-box" style="display:flex;align-items:center;gap:10px;">
                        <input type="text" placeholder="请输入验证码">
                        <img src="https://picsum.photos/100/40" alt="验证码图片">
                    </div>
                </div>
               
                <input type="submit" class="submit-btn" value="提交">
            </form>
        </div>
    </div>
</body>
</html>
