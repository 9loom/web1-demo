<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
/* 全局 */
*{margin:0;padding:0;box-sizing:border-box;}
/* 顶部搜索栏 */
.top-bar{
    display:flex;
    justify-content:center;
    padding:14px;
    gap:7px;
}
.top-bar input{
    width: 300px;px;
    padding: 10px;px;
}
/* 整体左右布局 flex */
.wrap{
    display:flex;
}
/* 左侧侧边导航 */
.sidebar{
    width:140px;
    padding:20px 10px;
    border-right:1px solid #ccc;
    height: calc(100vh - 60px);
}
.sidebar div{
    font-size:20px;
    margin:30px 0;
}
/* 右边内容网格，多列放卡片 */
.main{
    flex:1;
    padding:15px;
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap:12px;
}
/* 每一个小卡片 */
.item-card{
    border:1px solid #ddd;
    padding:8px;
    border-radius:6px;
}
.item-card h4{
    font-size:15px;
}
.item-card p{
    font-size:12px;
    color:#555;
}
.item-card {
    width: 200px;
    border: 1px solid #eee;
    padding: 8px;
    border-radius: 6px;
}
.item-card img{
    width: 100%;
    height: 160px;
    object-fit: cover;
}
</style>
</head>
